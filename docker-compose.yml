# Portable deployment: ignis (Obsidian Web) + obsidian-mcp-http (Streamable HTTP)
#
# Quick start:
#   cp .env.example .env    # then edit .env
#   docker compose up -d --build
#
# All paths are relative to this compose file. See README.md for details.

services:
  ignis:
    image: ${IGNIS_IMAGE:-nobbe/ignis@sha256:8faba2774dd9069360aedbf9ace87cdf926c454ccee56a2d7bc5ff7556737567}
    container_name: ${IGNIS_CONTAINER_NAME:-ignis}
    ports:
      - "${IGNIS_BIND:-127.0.0.1}:${IGNIS_PORT:-8880}:8080"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${VAULT_ROOT:-./vaults}:/vaults"
      - "${DATA_DIR:-./data}:/app/data"
      - obsidian-app:/app/obsidian-app
      # Docker Desktop 跨容器 inotify 不可靠；轮询版 watcher 保证 MCP 写入实时可见
      - "${WATCHER_PATCH:-./patches/server-core-watcher.js}:/app/packages/server-core/src/watcher.js:ro"
    restart: unless-stopped

  # Built from the obsidian-mcp-http fork, which serves Streamable HTTP natively.
  # No stdio wrapper or npm download at runtime.
  obsidian-mcp:
    build:
      context: ${MCP_SOURCE_DIR:-../obsidian-mcp-http}
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal}
    image: ${MCP_IMAGE:-obsidian-mcp-http:2.1.0}
    container_name: ${MCP_CONTAINER_NAME:-obsidian-mcp}
    user: "${PUID:-1000}:${PGID:-1000}"
    command:
      - serve
      - --vault
      - ${VAULT_ID:-notes}=/data
      - --transport
      - http
      - --host
      - 0.0.0.0
      - --port
      - "8811"
      - --path
      - /mcp
      # Extra accepted Host value. Set MCP_ALLOWED_HOST when clients reach this
      # container through a LAN address or hostname instead of 127.0.0.1.
      - --allowed-host
      - ${MCP_ALLOWED_HOST:-127.0.0.1}
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8811}:8811"
    volumes:
      - "${VAULT_DIR:-./vaults/test}:/data"
    environment:
      - HOME=/home/node
      # Native bearer-token auth; the token never appears in the command line.
      - OBSIDIAN_MCP_HTTP_TOKEN=${MCP_API_KEY:?MCP_API_KEY must be set in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8811/mcp').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  obsidian-app:
